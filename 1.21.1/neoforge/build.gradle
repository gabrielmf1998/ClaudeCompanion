plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def shared = new Properties()
file('../../mod.properties').withInputStream { shared.load(it) }
file('../mc.properties').withInputStream { shared.load(it) }

version = shared.mod_version
group = shared.mod_group_id

base {
    archivesName = "${shared.mod_id}-neoforge-${shared.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.java.srcDir '../common/src/main/java'

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${shared.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [mod_id: shared.mod_id, mod_name: shared.mod_name, mod_version: shared.mod_version,
                 mod_license: shared.mod_license, mod_authors: shared.mod_authors, mod_description: shared.mod_description,
                 neo_version_range: project.neo_version_range, loader_version_range: project.loader_version_range,
                 minecraft_version_range: project.minecraft_version_range]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from('../../LICENSE')
    manifest {
        attributes(['Implementation-Title': shared.mod_id, 'Implementation-Version': shared.mod_version, 'Implementation-Vendor': shared.mod_authors])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
