plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

def shared = new Properties()
file('../../mod.properties').withInputStream { shared.load(it) }
file('../mc.properties').withInputStream { shared.load(it) }

version = shared.mod_version
group = shared.mod_group_id

base {
    archivesName = "${shared.mod_id}-forge-${shared.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.java.srcDir '../common/src/main/java'

minecraft {
    mappings channel: 'official', version: shared.minecraft_version
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${shared.minecraft_version}-${project.forge_version}")
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: shared.mod_id, mod_name: shared.mod_name, mod_version: shared.mod_version,
                 mod_license: shared.mod_license, mod_authors: shared.mod_authors, mod_description: shared.mod_description,
                 forge_version_range: project.forge_version_range, minecraft_version_range: project.minecraft_version_range]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    from('../../LICENSE')
    manifest {
        attributes(['Implementation-Title': shared.mod_id, 'Implementation-Version': shared.mod_version, 'Implementation-Vendor': shared.mod_authors])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
