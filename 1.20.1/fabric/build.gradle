plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

def shared = new Properties()
file('../../mod.properties').withInputStream { shared.load(it) }
file('../mc.properties').withInputStream { shared.load(it) }

version = shared.mod_version
group = shared.mod_group_id

base {
	archivesName = "${shared.mod_id}-fabric-${shared.minecraft_version}"
}

sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.java.srcDir '../common/src/main/java'

dependencies {
	minecraft "com.mojang:minecraft:${shared.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: shared.mod_version, description: shared.mod_description, minecraft_version: shared.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from('../../LICENSE')
}
